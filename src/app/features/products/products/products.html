<div class="page-header">

    <h2>Products</h2>

    <button
        mat-raised-button
        color="primary"
        routerLink="/products/add">

        <mat-icon>add</mat-icon>

        Add Product

    </button>

</div>

<mat-divider></mat-divider>

<div class="product-list">

    <mat-card
        class="product-card"
        *ngFor="let product of (products$ | async)">

        <mat-card-content>

            <div class="product-info">

                <div>

                    <h3>

                        <mat-icon class="product-icon">

                            inventory_2

                        </mat-icon>

                        {{ product.name }}

                    </h3>

                    <p class="price">

                        ₹ {{ product.price }}

                    </p>

                </div>

                <button
                    mat-stroked-button
                    color="primary"
                    [routerLink]="['/products', product.id]">

                    <mat-icon>

                        visibility

                    </mat-icon>

                    View Details

                </button>

            </div>

        </mat-card-content>

    </mat-card>

</div>
