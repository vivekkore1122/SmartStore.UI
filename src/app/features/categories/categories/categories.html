<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="mb-0">Categories</h1>

    <button mat-raised-button color="primary" routerLink="/categories/add">

        <mat-icon class="header-icon">
            add</mat-icon>

        Add Category

    </button>

</div>

<mat-card>

    <!--<ng-container *ngIf="categories$ | async as categories"></ng-container>-->

    <table mat-table [dataSource]="(categories$ | async) || []" class="w-100">

        <!-- ID -->
        <ng-container matColumnDef="id">

            <th mat-header-cell *matHeaderCellDef>ID</th>

            <td mat-cell *matCellDef="let category">

                {{ category.id }}

            </td>

        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">

            <th mat-header-cell *matHeaderCellDef>Name</th>

            <td mat-cell *matCellDef="let category">

                {{ category.name }}

            </td>

        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">

            <th mat-header-cell *matHeaderCellDef>Description</th>

            <td mat-cell *matCellDef="let category">

                {{ category.description }}

            </td>

        </ng-container>

        <!-- Product Count -->
        <ng-container matColumnDef="productCount">

            <th mat-header-cell *matHeaderCellDef>Products</th>

            <td mat-cell *matCellDef="let category">

                {{ category.productCount }}

            </td>

        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">

            <th mat-header-cell *matHeaderCellDef>Status</th>

            <td mat-cell *matCellDef="let category">

                <span class="badge" [class.bg-success]="category.status" [class.bg-danger]="!category.status">

                    {{ category.status ? 'Active' : 'Inactive' }}

                </span>

            </td>

        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>Actions</th>

            <td mat-cell *matCellDef="let category">

                <button mat-icon-button color="primary">

                    <mat-icon>edit</mat-icon>

                </button>

                <button mat-icon-button color="warn">

                    <mat-icon>delete</mat-icon>

                </button>

            </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns">

        </tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;">

        </tr>

    </table>

</mat-card>
