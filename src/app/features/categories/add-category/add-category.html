<div class="form-container">

    <mat-card class="form-card">

        <mat-card-header>

            <mat-icon class="header-icon">

                category

            </mat-icon>

            <mat-card-title>

                Add New Category

            </mat-card-title>

        </mat-card-header>

        <mat-divider></mat-divider>

        <mat-card-content>

            <form
                [formGroup]="categoryForm"
                (ngSubmit)="onSubmit()">

                <!-- Category Name -->

                <mat-form-field
                    appearance="outline"
                    class="full-width">

                    <mat-label>

                        Category Name

                    </mat-label>

                    <input
                        matInput
                        formControlName="categoryName"
                        placeholder="Enter category name">

                    <mat-icon matSuffix>

                        category

                    </mat-icon>

                    <mat-error
                        *ngIf="categoryForm.get('categoryName')?.hasError('required')">

                        Category Name is required

                    </mat-error>

                </mat-form-field>

                <!-- Description -->

                <mat-form-field
                    appearance="outline"
                    class="full-width">

                    <mat-label>

                        Description

                    </mat-label>

                    <textarea
                        matInput
                        rows="5"
                        formControlName="description"
                        placeholder="Enter category description">

                    </textarea>

                    <mat-error
                        *ngIf="categoryForm.get('description')?.hasError('required')">

                        Description is required

                    </mat-error>

                    <mat-error
                        *ngIf="categoryForm.get('description')?.hasError('minlength')">

                        Description must be at least 10 characters

                    </mat-error>

                </mat-form-field>

                <mat-divider></mat-divider>

                <div class="button-group">

                    <button
                        mat-stroked-button
                        color="primary"
                        routerLink="/categories">

                        <mat-icon>

                            arrow_back

                        </mat-icon>

                        Back

                    </button>

                    <button
                        mat-raised-button
                        color="primary"
                        type="submit"
                        [disabled]="categoryForm.invalid">

                        <mat-icon>

                            save

                        </mat-icon>

                        Save Category

                    </button>

                </div>

            </form>

        </mat-card-content>

    </mat-card>

</div>
