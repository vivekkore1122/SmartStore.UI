<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>QR Code Generator</h3>

        </div>

        <div class="card-body text-center">

            <qrcode
                [qrdata]="qrData"
                [width]="250"
                [errorCorrectionLevel]="'M'">
            </qrcode>

            <hr>

            <h5>Encoded Data</h5>

            <pre>{{ qrData }}</pre>

        </div>

    </div>

</div>
