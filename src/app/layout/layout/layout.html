<mat-sidenav-container class="layout-container">

    <mat-sidenav
        #drawer
        [mode]="isMobile ? 'over' : 'side'"
        [opened]="!isMobile"
        class="sidebar">

        <app-sidebar></app-sidebar>

    </mat-sidenav>

    <mat-sidenav-content>

        <app-navbar
            (toggleSidebar)="drawer.toggle()">
        </app-navbar>

        

        <main class="content">

            <router-outlet></router-outlet>

        </main>

        <app-footer></app-footer>

    </mat-sidenav-content>

</mat-sidenav-container>
